<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kuis IPS/IPAS Kelas 4 dan 5 SD</title><style>
:root{--blue:#2457a7;--pale:#eef4ff;--border:#dbe3ef;--text:#1f2937}*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:var(--text);font:16px/1.55 Arial,Helvetica,sans-serif}header{background:linear-gradient(135deg,#2457a7,#4784d7);color:white;text-align:center;padding:28px 16px}header h1{margin:0 0 8px;font-size:clamp(1.5rem,4vw,2.2rem)}header p{margin:0}main{max-width:900px;margin:22px auto;padding:0 14px 36px}.toolbar,.question,#result{background:white;border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 3px 12px #0f172a0a}.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}.toolbar label{font-weight:bold}select,button{font:inherit;border-radius:9px;padding:10px 14px}select{border:1px solid var(--border);background:white}button{border:0;cursor:pointer;font-weight:bold}.primary{color:white;background:var(--blue)}.secondary{color:#173d78;background:#e8effb}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.question h3{margin:0 0 5px;font-size:1.03rem}.meta,.small{color:#64748b;font-size:.88rem}.options{display:grid;gap:8px;margin-top:12px}.option{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);padding:10px 12px;border-radius:9px;cursor:pointer}.option:hover{background:#f8fbff}.option input{margin-top:5px}.question.correct{border-color:#70c68a;background:#e7f8ed}.question.incorrect{border-color:#e99b9b;background:#fff0f0}.feedback{font-size:.9rem;font-weight:bold;margin-top:10px}#result{display:none}#result h2{margin-top:0}.score{font-size:2rem;font-weight:800;color:var(--blue)}footer{text-align:center;padding:10px 16px 26px;color:#64748b;font-size:.85rem}@media(max-width:600px){.toolbar{align-items:stretch}.toolbar label{display:grid;gap:6px}}
</style></head><body><header><h1>Kuis IPS/IPAS Kelas 4 dan 5 SD</h1><p>50 soal pilihan ganda • LOTS dan MOTS • Pilih jawaban terbaik</p></header><main><section class="toolbar"><div><strong id="progress">0 dari 50 soal dijawab</strong><div class="small">Setiap jawaban benar bernilai 2 poin.</div></div><label for="classFilter">Tampilkan: <select id="classFilter"><option value="all">Semua soal (50)</option><option value="4">Kelas 4 (20 soal)</option><option value="5">Kelas 5 (30 soal)</option></select></label></section><div id="quiz"></div><div class="actions"><button class="primary" id="submitBtn">Periksa Jawaban</button><button class="secondary" id="resetBtn">Ulangi Kuis</button></div><section id="result" aria-live="polite"></section></main><footer>Latihan IPS/IPAS SD • Materi disusun berdasarkan kisi-kisi umum dan dapat disesuaikan dengan ATP sekolah.</footer><script>
const questions=[{"n": 1, "c": 4, "l": "LOTS", "q": "Gambar permukaan bumi yang dibuat pada bidang datar dengan skala tertentu disebut ....", "o": ["Denah", "Peta", "Diagram", "Tabel"], "a": 1}, {"n": 2, "c": 4, "l": "LOTS", "q": "Arah mata angin yang terletak di antara utara dan timur adalah ....", "o": ["Barat laut", "Tenggara", "Timur laut", "Barat daya"], "a": 2}, {"n": 3, "c": 4, "l": "LOTS", "q": "Berikut yang termasuk kenampakan alam adalah ....", "o": ["Jembatan", "Waduk", "Gunung", "Jalan raya"], "a": 2}, {"n": 4, "c": 4, "l": "LOTS", "q": "Contoh sumber daya alam yang dapat diperbarui adalah ....", "o": ["Minyak bumi", "Batu bara", "Gas alam", "Tumbuhan"], "a": 3}, {"n": 5, "c": 4, "l": "LOTS", "q": "Kegiatan menghasilkan barang atau jasa disebut ....", "o": ["Konsumsi", "Produksi", "Distribusi", "Komunikasi"], "a": 1}, {"n": 6, "c": 4, "l": "LOTS", "q": "Orang yang menyalurkan barang dari produsen kepada konsumen disebut ....", "o": ["Distributor", "Konsumen", "Petani", "Pengrajin"], "a": 0}, {"n": 7, "c": 4, "l": "LOTS", "q": "Kegiatan menggunakan barang atau jasa untuk memenuhi kebutuhan disebut ....", "o": ["Produksi", "Distribusi", "Konsumsi", "Promosi"], "a": 2}, {"n": 8, "c": 4, "l": "LOTS", "q": "Contoh kebutuhan pokok manusia adalah ....", "o": ["Perhiasan", "Makanan", "Mainan mahal", "Barang koleksi"], "a": 1}, {"n": 9, "c": 4, "l": "LOTS", "q": "Sikap yang tepat terhadap teman yang berbeda suku adalah ....", "o": ["Menjauhinya", "Mengejek bahasanya", "Menghargai perbedaannya", "Memaksanya mengikuti kebiasaan kita"], "a": 2}, {"n": 10, "c": 4, "l": "LOTS", "q": "Berikut yang merupakan contoh kearifan lokal adalah ....", "o": ["Membuang sampah ke sungai", "Gotong royong membersihkan lingkungan", "Menebang semua pohon di hutan", "Menggunakan air secara berlebihan"], "a": 1}, {"n": 11, "c": 4, "l": "MOTS", "q": "Rina ingin pergi dari rumah ke perpustakaan. Pada denah, perpustakaan berada di sebelah timur rumah. Rina harus berjalan ke arah ....", "o": ["Barat", "Utara", "Selatan", "Timur"], "a": 3}, {"n": 12, "c": 4, "l": "MOTS", "q": "Daerah tempat tinggal Beni memiliki tanah subur dan curah hujan yang cukup. Pekerjaan yang sesuai dengan kondisi tersebut adalah ....", "o": ["Petani", "Nelayan laut", "Penambang minyak lepas pantai", "Pekerja pelabuhan"], "a": 0}, {"n": 13, "c": 4, "l": "MOTS", "q": "Pak Darto menanam sayuran, kemudian menjual hasil panennya ke pasar. Kegiatan menanam sayuran termasuk ....", "o": ["Konsumsi", "Produksi", "Distribusi", "Pertukaran"], "a": 1}, {"n": 14, "c": 4, "l": "MOTS", "q": "Siti membeli buku di toko untuk belajar. Dalam kegiatan ekonomi tersebut, Siti berperan sebagai ....", "o": ["Produsen", "Distributor", "Konsumen", "Pengangkut barang"], "a": 2}, {"n": 15, "c": 4, "l": "MOTS", "q": "Warga desa membersihkan selokan bersama-sama agar tidak terjadi banjir. Manfaat utama kegiatan tersebut adalah ....", "o": ["Mempererat kerja sama dan menjaga lingkungan", "Membuat warga saling bersaing", "Mengurangi kepedulian warga", "Menghambat kegiatan masyarakat"], "a": 0}, {"n": 16, "c": 4, "l": "MOTS", "q": "Penduduk yang tinggal di daerah pantai banyak bekerja sebagai nelayan karena ....", "o": ["Tanahnya selalu cocok untuk perkebunan teh", "Dekat dengan sumber daya laut", "Tidak memiliki sumber daya alam", "Jauh dari perairan"], "a": 1}, {"n": 17, "c": 4, "l": "MOTS", "q": "Andi melihat temannya kesulitan memahami pelajaran. Sikap yang menunjukkan kepedulian sosial adalah ....", "o": ["Membiarkannya", "Menertawakannya", "Membantu menjelaskan pelajaran", "Menyuruhnya berhenti belajar"], "a": 2}, {"n": 18, "c": 4, "l": "MOTS", "q": "Warga menggunakan air sungai untuk kebutuhan sehari-hari. Agar air tetap tersedia dan bersih, tindakan yang tepat adalah ....", "o": ["Membuang sampah ke sungai", "Membuang limbah ke sungai", "Menjaga kebersihan sungai", "Menutup semua aliran sungai"], "a": 2}, {"n": 19, "c": 4, "l": "MOTS", "q": "Di suatu daerah terdapat tarian tradisional yang berbeda dengan tarian di daerah lain. Sikap yang tepat adalah ....", "o": ["Menganggap tarian sendiri paling baik", "Menghargai tarian dari daerah lain", "Melarang orang mempelajari tarian lain", "Menolak semua budaya yang berbeda"], "a": 1}, {"n": 20, "c": 4, "l": "MOTS", "q": "Keluarga Dika mencatat cerita tentang asal-usul keluarga dari kakek dan nenek. Kegiatan tersebut bermanfaat untuk ....", "o": ["Mengetahui sejarah keluarga", "Menentukan harga barang", "Menghitung luas wilayah", "Mengetahui arah mata angin"], "a": 0}, {"n": 21, "c": 5, "l": "LOTS", "q": "Indonesia terletak di antara dua benua, yaitu ....", "o": ["Asia dan Afrika", "Asia dan Australia", "Australia dan Eropa", "Eropa dan Amerika"], "a": 1}, {"n": 22, "c": 5, "l": "LOTS", "q": "Indonesia juga terletak di antara dua samudra, yaitu ....", "o": ["Samudra Hindia dan Samudra Pasifik", "Samudra Atlantik dan Samudra Arktik", "Samudra Atlantik dan Samudra Hindia", "Samudra Arktik dan Samudra Pasifik"], "a": 0}, {"n": 23, "c": 5, "l": "LOTS", "q": "Salah satu manfaat peta adalah ....", "o": ["Mengetahui lokasi suatu tempat", "Mengetahui rasa makanan", "Mengukur berat badan secara langsung", "Menentukan usia seseorang"], "a": 0}, {"n": 24, "c": 5, "l": "LOTS", "q": "Kegiatan mengolah bahan mentah menjadi barang jadi disebut ....", "o": ["Konsumsi", "Produksi", "Distribusi", "Transportasi"], "a": 1}, {"n": 25, "c": 5, "l": "LOTS", "q": "Berikut yang termasuk kegiatan distribusi adalah ....", "o": ["Petani menanam padi", "Pembeli memakan nasi", "Pedagang mengirim beras ke toko", "Pengrajin membuat meja"], "a": 2}, {"n": 26, "c": 5, "l": "LOTS", "q": "Orang yang menggunakan barang atau jasa disebut ....", "o": ["Produsen", "Distributor", "Konsumen", "Eksportir"], "a": 2}, {"n": 27, "c": 5, "l": "LOTS", "q": "Kegiatan menjual barang ke luar negeri disebut ....", "o": ["Impor", "Ekspor", "Konsumsi", "Produksi"], "a": 1}, {"n": 28, "c": 5, "l": "LOTS", "q": "Kegiatan membeli barang dari luar negeri disebut ....", "o": ["Ekspor", "Distribusi", "Impor", "Promosi"], "a": 2}, {"n": 29, "c": 5, "l": "LOTS", "q": "Contoh sumber daya alam yang tidak dapat diperbarui adalah ....", "o": ["Angin", "Sinar matahari", "Batu bara", "Tumbuhan"], "a": 2}, {"n": 30, "c": 5, "l": "LOTS", "q": "Salah satu contoh peninggalan sejarah berupa bangunan adalah ....", "o": ["Pasar modern", "Candi", "Pusat perbelanjaan", "Terminal bus"], "a": 1}, {"n": 31, "c": 5, "l": "LOTS", "q": "Sikap yang tepat untuk menjaga persatuan dalam keberagaman adalah ....", "o": ["Menghormati perbedaan", "Memaksakan pendapat", "Merendahkan budaya lain", "Memilih teman berdasarkan suku"], "a": 0}, {"n": 32, "c": 5, "l": "LOTS", "q": "Salah satu cara menjaga kelestarian hutan adalah ....", "o": ["Membakar hutan", "Menebang semua pohon", "Melakukan penanaman kembali", "Membuang sampah ke hutan"], "a": 2}, {"n": 33, "c": 5, "l": "LOTS", "q": "Kegiatan mengubah bahan baku menjadi produk yang memiliki nilai guna disebut ....", "o": ["Konsumsi", "Pengolahan", "Penggunaan", "Penghematan"], "a": 1}, {"n": 34, "c": 5, "l": "LOTS", "q": "Berikut yang merupakan contoh interaksi sosial adalah ....", "o": ["Seseorang tidur sendirian", "Siswa berdiskusi dalam kelompok", "Batu jatuh dari tebing", "Hujan turun di halaman"], "a": 1}, {"n": 35, "c": 5, "l": "LOTS", "q": "Salah satu penyebab terjadinya perdagangan antardaerah adalah ....", "o": ["Semua daerah menghasilkan barang yang sama", "Setiap daerah memiliki kebutuhan dan hasil produksi yang berbeda", "Setiap daerah tidak membutuhkan barang lain", "Semua penduduk tinggal di satu daerah"], "a": 1}, {"n": 36, "c": 5, "l": "MOTS", "q": "Daerah A menghasilkan banyak sayuran, sedangkan daerah B menghasilkan banyak ikan. Kedua daerah saling menjual hasil produksinya. Manfaat kegiatan tersebut adalah ....", "o": ["Kebutuhan kedua daerah dapat terpenuhi", "Hasil produksi kedua daerah akan hilang", "Penduduk tidak dapat memperoleh barang", "Kegiatan ekonomi menjadi terhenti"], "a": 0}, {"n": 37, "c": 5, "l": "MOTS", "q": "Sebuah desa memiliki tanah subur dan sumber air yang cukup. Kegiatan ekonomi yang paling sesuai untuk dikembangkan adalah ....", "o": ["Pertanian", "Penangkapan ikan laut", "Pertambangan minyak lepas pantai", "Pembuatan garam dari air laut"], "a": 0}, {"n": 38, "c": 5, "l": "MOTS", "q": "Pak Hasan membuat sepatu di rumahnya. Ia kemudian mengirim sepatu tersebut ke toko untuk dijual. Urutan kegiatan ekonomi yang tepat adalah ....", "o": ["Konsumsi–produksi–distribusi", "Produksi–distribusi–konsumsi", "Distribusi–konsumsi–produksi", "Produksi–konsumsi–distribusi"], "a": 1}, {"n": 39, "c": 5, "l": "MOTS", "q": "Harga cabai meningkat karena hasil panen berkurang akibat cuaca buruk. Kesimpulan yang tepat adalah ....", "o": ["Cuaca dapat memengaruhi hasil produksi dan harga barang", "Cuaca tidak berhubungan dengan kegiatan ekonomi", "Harga barang selalu tetap", "Hasil panen tidak memengaruhi persediaan barang"], "a": 0}, {"n": 40, "c": 5, "l": "MOTS", "q": "Sebuah daerah memiliki hutan yang luas. Agar sumber daya alam tersebut tetap terjaga sekaligus bermanfaat bagi masyarakat, tindakan yang tepat adalah ....", "o": ["Menebang seluruh pohon untuk dijual", "Mengelola hutan secara bijaksana dan melakukan reboisasi", "Mengubah seluruh hutan menjadi permukiman", "Membakar hutan untuk membuka lahan"], "a": 1}, {"n": 41, "c": 5, "l": "MOTS", "q": "Warga suatu daerah memiliki tradisi kerja bakti yang dilakukan secara rutin. Tradisi tersebut dapat memperkuat ....", "o": ["Persaingan antarwarga", "Perpecahan masyarakat", "Kebersamaan dan gotong royong", "Sikap mementingkan diri sendiri"], "a": 2}, {"n": 42, "c": 5, "l": "MOTS", "q": "Banyak penduduk desa pindah ke kota untuk mencari pekerjaan. Peristiwa tersebut disebut ....", "o": ["Urbanisasi", "Reboisasi", "Transmigrasi barang", "Distribusi"], "a": 0}, {"n": 43, "c": 5, "l": "MOTS", "q": "Sebuah daerah wisata memiliki pantai yang indah. Agar wisata tetap berkembang dalam jangka panjang, masyarakat sebaiknya ....", "o": ["Membuang sampah di pantai", "Menjaga kebersihan dan kelestarian pantai", "Mengambil seluruh biota laut", "Membangun bangunan di semua area pantai"], "a": 1}, {"n": 44, "c": 5, "l": "MOTS", "q": "Pedagang menggunakan aplikasi digital untuk menjual produknya kepada pembeli dari berbagai daerah. Hal tersebut menunjukkan bahwa ....", "o": ["Teknologi dapat memperluas jangkauan perdagangan", "Teknologi selalu mengurangi jumlah pembeli", "Perdagangan hanya dapat dilakukan secara langsung", "Barang tidak dapat dijual ke daerah lain"], "a": 0}, {"n": 45, "c": 5, "l": "MOTS", "q": "Sebuah pabrik membuang limbah tanpa pengolahan ke sungai. Dampak yang paling mungkin terjadi adalah ....", "o": ["Kualitas air meningkat", "Kehidupan makhluk air semakin terjaga", "Air tercemar dan ekosistem terganggu", "Persediaan air bersih bertambah"], "a": 2}, {"n": 46, "c": 5, "l": "MOTS", "q": "Di sebuah daerah, dahulu masyarakat menggunakan alat pertanian sederhana. Sekarang sebagian petani menggunakan mesin modern. Perubahan tersebut menunjukkan ....", "o": ["Perubahan cara kerja akibat perkembangan teknologi", "Hilangnya seluruh kegiatan pertanian", "Tidak adanya perubahan dalam masyarakat", "Berkurangnya manfaat teknologi"], "a": 0}, {"n": 47, "c": 5, "l": "MOTS", "q": "Sebuah daerah menghasilkan kopi dalam jumlah besar, sedangkan daerah lain memiliki banyak pabrik pengolahan kopi. Kerja sama yang paling menguntungkan adalah ....", "o": ["Daerah penghasil kopi menghentikan panen", "Kedua daerah bekerja sama dalam pengolahan dan pemasaran kopi", "Daerah pengolah kopi menolak semua bahan baku", "Kedua daerah berhenti melakukan perdagangan"], "a": 1}, {"n": 48, "c": 5, "l": "MOTS", "q": "Saat mengunjungi museum, siswa menemukan benda peninggalan masa lalu. Tindakan yang tepat untuk menghargai peninggalan tersebut adalah ....", "o": ["Menyentuh dan memindahkan semua benda", "Mencoret benda agar mudah dikenali", "Mematuhi aturan museum dan menjaga benda bersejarah", "Membawa pulang benda yang disukai"], "a": 2}, {"n": 49, "c": 5, "l": "MOTS", "q": "Warga dari berbagai suku bekerja sama membangun fasilitas umum di lingkungan mereka. Perilaku tersebut menunjukkan bahwa ....", "o": ["Perbedaan menghalangi kerja sama", "Kerja sama hanya dapat dilakukan oleh orang yang sama sukunya", "Keberagaman dapat menjadi kekuatan jika disertai sikap saling menghargai", "Setiap kelompok harus bekerja sendiri-sendiri"], "a": 2}, {"n": 50, "c": 5, "l": "MOTS", "q": "Sebuah desa memiliki potensi pertanian, tetapi hasil panen sering rusak sebelum sampai ke pasar. Upaya yang paling tepat untuk mengatasi masalah tersebut adalah ....", "o": ["Mengurangi jumlah petani", "Memperbaiki penyimpanan dan transportasi hasil panen", "Membuang hasil panen yang masih baik", "Menghentikan penjualan ke pasar"], "a": 1}];const letters=['A','B','C','D'];const quizEl=document.getElementById('quiz'),filterEl=document.getElementById('classFilter'),resultEl=document.getElementById('result');let submitted=false;
function renderQuiz(){const filter=filterEl.value,visible=questions.filter(q=>filter==='all'||String(q.c)===filter);quizEl.innerHTML=visible.map(q=>`<section class="question" id="question-${q.n}"><div class="meta">Soal ${q.n} • Kelas ${q.c} • ${q.l}</div><h3>${q.n}. ${q.q}</h3><div class="options">${q.o.map((op,i)=>`<label class="option"><input type="radio" name="q${q.n}" value="${i}" ${submitted?'disabled':''}><span><strong>${letters[i]}.</strong> ${op}</span></label>`).join('')}</div><div class="feedback" id="feedback-${q.n}"></div></section>`).join('');updateProgress();if(submitted)showAnswers()}
function updateProgress(){const count=questions.filter(q=>document.querySelector(`input[name="q${q.n}"]:checked`)).length;document.getElementById('progress').textContent=`${count} dari 50 soal dijawab`}
document.addEventListener('change',e=>{if(e.target.matches('input[type="radio"]'))updateProgress()});
function showAnswers(){questions.forEach(q=>{const card=document.getElementById(`question-${q.n}`),fb=document.getElementById(`feedback-${q.n}`);if(!card||!fb)return;const selected=document.querySelector(`input[name="q${q.n}"]:checked`),ok=selected&&Number(selected.value)===q.a;card.classList.toggle('correct',!!ok);card.classList.toggle('incorrect',!ok);fb.textContent=selected?(ok?'Benar!':`Belum tepat. Jawaban benar: ${letters[q.a]}. ${q.o[q.a]}`):`Belum dijawab. Jawaban benar: ${letters[q.a]}. ${q.o[q.a]}`})}
document.getElementById('submitBtn').addEventListener('click',()=>{if(submitted)return;const count=questions.filter(q=>document.querySelector(`input[name="q${q.n}"]:checked`)).length;if(!confirm(count<50?`Baru ${count} dari 50 soal yang dijawab. Tetap periksa jawaban?`:'Periksa semua jawaban sekarang?'))return;submitted=true;document.querySelectorAll('#quiz input').forEach(x=>x.disabled=true);showAnswers();const correct=questions.filter(q=>{const s=document.querySelector(`input[name="q${q.n}"]:checked`);return s&&Number(s.value)===q.a}).length;const c4=questions.filter(q=>q.c===4),c5=questions.filter(q=>q.c===5),scoreFor=list=>list.filter(q=>{const s=document.querySelector(`input[name="q${q.n}"]:checked`);return s&&Number(s.value)===q.a}).length;resultEl.style.display='block';resultEl.innerHTML=`<h2>Hasil Kuis</h2><div class="score">${correct*2}/100</div><p>Jawaban benar: <strong>${correct} dari 50 soal</strong><br>Jawaban salah atau kosong: <strong>${50-correct} soal</strong></p><p><strong>Kelas 4:</strong> ${scoreFor(c4)} dari 20 benar (${scoreFor(c4)*2}/40 poin)<br><strong>Kelas 5:</strong> ${scoreFor(c5)} dari 30 benar (${scoreFor(c5)*2}/60 poin)</p><p class="small">Jawaban benar berwarna hijau. Jawaban salah atau kosong berwarna merah.</p>`;resultEl.scrollIntoView({behavior:'smooth',block:'start'});document.getElementById('submitBtn').textContent='Jawaban Sudah Diperiksa'});
document.getElementById('resetBtn').addEventListener('click',()=>{if(!confirm('Mulai ulang kuis? Semua jawaban akan dihapus.'))return;submitted=false;resultEl.style.display='none';resultEl.innerHTML='';document.getElementById('submitBtn').textContent='Periksa Jawaban';renderQuiz();window.scrollTo({top:0,behavior:'smooth'})});filterEl.addEventListener('change',renderQuiz);renderQuiz();
</script></body></html>
